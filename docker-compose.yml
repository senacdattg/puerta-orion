services:
  db:
    image: mysql:8
    container_name: puerta_mysql
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-puerta_orion}
      # MYSQL_USER: ${MYSQL_USER:-root}
      # MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network

  backend:
    build:
      context: ./backend
    container_name: puerta_backend
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - sed -i 's/\r$//' /app/entrypoint.sh && exec /app/entrypoint.sh
    env_file:
      - ./backend/.env
    environment:
      FLASK_ENV: development
      RUN_SEEDERS: "true"
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      DB_NAME: ${DB_NAME:-puerta_orion}
      CORS_ORIGINS: http://localhost:8080,http://frontend,http://frontend:80,http://frontend:8080
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
    container_name: puerta_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: auto
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge

