# ============================================
# Configuración de SonarQube
# ============================================

# Identificación del proyecto
sonar.projectKey=puerta-orion
sonar.projectName=puerta-orion
sonar.sourceEncoding=UTF-8

# ============================================
# RUTAS DE CÓDIGO FUENTE
# ============================================
# Solo código fuente de producción
# Los archivos de test se excluyen con sonar.exclusions
# Incluir Dockerfiles para análisis de seguridad
sonar.sources=backend/src,frontend/src,backend/Dockerfile,frontend/Dockerfile

# ============================================
# RUTAS DE TESTS
# ============================================
# Backend: tests en carpeta separada backend/tests/
# Frontend: tests mezclados en frontend/src/, identificados con sonar.test.inclusions
# IMPORTANTE: frontend/src contiene tanto código fuente como tests
sonar.tests=backend/tests,frontend/tests

# ============================================
# IDENTIFICACIÓN DE ARCHIVOS DE TEST
# ============================================
# Identificar archivos de test dentro de sonar.tests
# IMPORTANTE: Usar **/* para coincAidir con archivos en cualquier subdirectorio
# SonarQube NO soporta sintaxis de llaves {} como {js,ts,jsx,tsx}
sonar.test.inclusions=\
  **/*.spec.js,\
  **/*.spec.ts,\
  **/*.spec.jsx,\
  **/*.spec.tsx,\
  **/*.test.js,\
  **/*.test.ts,\
  **/*.test.jsx,\
  **/*.test.tsx,\
  **/*test*.py

# ============================================
# EXCLUSIONES DEL ANÁLISIS DE CÓDIGO
# ============================================
# Excluir del análisis de código fuente:
# - Reportes de cobertura
# - Archivos de test (usar **/* para cualquier nivel de directorio)
# - Helpers y mocks de test
# - Carpetas de build y dependencias
sonar.exclusions=\
  frontend/coverage/**,\
  backend/coverage/**,\
  **/*.spec.js,\
  **/*.spec.ts,\
  **/*.spec.jsx,\
  **/*.spec.tsx,\
  **/*.test.js,\
  **/*.test.ts,\
  **/*.test.jsx,\
  **/*.test.tsx,\
  **/test-helpers.*,\
  **/test-setup.*,\
  **/__tests__/**,\
  **/__mocks__/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,
  **/migrations/**,
  **/tests/**

# ============================================
# EXCLUSIONES DE COBERTURA
# ============================================
# Archivos que NO deben contar para cobertura:
# - Todos los archivos de test (usar **/* para cualquier nivel de directorio)
# - Helpers y mocks de test
# - Archivos de configuración de tests
# - Migraciones de base de datos (no son código de producción)
# - Archivos de configuración de build y herramientas
# - Archivos de entrada mínimos (main.js solo importa, runtime-config es estático)
# IMPORTANTE: Estos archivos están excluidos de la medición de cobertura
sonar.coverage.exclusions=\
  **/*.spec.js,\
  **/*.spec.ts,\
  **/*.spec.jsx,\
  **/*.spec.tsx,\
  **/*.test.js,\
  **/*.test.ts,\
  **/*.test.jsx,\
  **/*.test.tsx,\
  **/*test*.py,\
  **/test-helpers.*,\
  **/test-setup.*,\
  **/__tests__/**,\
  **/__mocks__/**,\
  **/migrations/**,\
  **/migrations/versions/**,\
  backend/run_seeders.py,\
  frontend/src/main.js,\
  frontend/vitest.config.js,\
  frontend/vite.config.js,\
  frontend/eslint.config.js,\
  frontend/jsconfig.json,\
  frontend/tests/**,\
  backend/tests/**,\
  backend/tests/helpers/**,\
  backend/tests/fixtures/**,\
  frontend/tests/fixtures/**,\
  frontend/tests/mocks/**,\
  frontend/tests/setup.js,\
  frontend/tests/utils/**,\
  frontend/public/config/runtime-config.js
  

# ============================================
# REPORTES DE COBERTURA
# ============================================
# Python: reporte XML generado por pytest-cov
sonar.python.coverage.reportPaths=backend/coverage.xml

# JavaScript/TypeScript: reporte LCOV generado por Vitest
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# ============================================
# CONFIGURACIÓN DE LENGUAJES
# ============================================
# Versión de Python (requerido para Python 3.12+)
# SonarQube detecta automáticamente JavaScript/TypeScript basándose en extensiones
sonar.python.version=3.13

# ============================================
# DESACTIVAR REGLAS ESPECÍFICAS DE DOCKER
# ============================================
# Desactivar hotspots de seguridad justificados en Dockerfiles:
# - docker:S6470: COPY recursivo es seguro gracias a .dockerignore configurado
# - docker:S6505: Scripts de npm son necesarios para compilar dependencias nativas
# - docker:S6504: Permisos de escritura ya están manejados explícitamente
# Estas reglas se desactivan porque:
# 1. El COPY recursivo es seguro debido a .dockerignore que excluye archivos sensibles
# 2. Los scripts de npm son necesarios para compilar binarios nativos (Rollup, etc.)
# 3. Los permisos de escritura se manejan explícitamente después del COPY
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6470
sonar.issue.ignore.multicriteria.e1.resourceKey=**/Dockerfile
sonar.issue.ignore.multicriteria.e2.ruleKey=docker:S6505
sonar.issue.ignore.multicriteria.e2.resourceKey=**/Dockerfile
sonar.issue.ignore.multicriteria.e3.ruleKey=docker:S6504
sonar.issue.ignore.multicriteria.e3.resourceKey=**/Dockerfile

