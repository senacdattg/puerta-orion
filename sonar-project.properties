# ==================================================
# CONFIGURACIÓN SONARSCANNER - PUERTA DE ORION
# ==================================================

# Identificador único del proyecto en SonarQube
sonar.projectKey=puerta-orion

# Nombre del proyecto
sonar.projectName=puerta-orion

# Versión del proyecto
sonar.projectVersion=1.0

# Directorios fuente (relativos a este archivo)
# Incluimos backend/src y también archivos importantes en backend/
sonar.sources=backend/src,backend,frontend/src

# Codificación de los archivos fuente
sonar.sourceEncoding=UTF-8

# ============ CONFIGURACIÓN PYTHON ============
# Versión de Python
sonar.python.version=3.13

# Directorios de código Python (incluye backend/ para app.py, config.py, run_seeders.py)
sonar.python.sources=backend/src,backend

# Inclusiones para Python
sonar.python.inclusions=**/*.py

# Inclusiones globales (para todos los lenguajes)
sonar.inclusions=**/*.py,**/*.js,**/*.vue

# ============ CONFIGURACIÓN JAVASCRIPT/VUE ============
# Directorios de código JavaScript/Vue
sonar.javascript.sources=frontend/src

# Exclusiones para JavaScript/Vue
sonar.javascript.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.min.js,**/*.min.css,**/*.config.js,**/vitest.config.js,**/runtime-config.js,**/public/config/runtime-config.js

sonar.coverage.exclusions=**/*.spec.{js,ts},**/*.test.{js,ts},**/test-helpers.*,**/test-setup.js,**/*test.py,**/*.config.js,**/vitest.config.js,**/runtime-config.js,**/public/config/runtime-config.js

# Inclusiones para JavaScript/Vue
sonar.javascript.inclusions=**/*.js,**/*.vue

# ============ EXCLUSIONES GLOBALES ============
# Archivos y directorios a excluir del análisis
sonar.exclusions=**/__pycache__/**,**/venv/**,**/env/**,**/node_modules/**,**/dist/**,**/build/**,**/migrations/**,**/tests/**,**/test_*.py,**/conftest.py,**/htmlcov/**,**/instance/**,**/logs/**,**/static/uploads/**,**/*.min.js,**/*.min.css,**/.git/**,**/.vscode/**,**/.idea/**,**/tmp/**,**/*.config.js,**/vitest.config.js,**/runtime-config.js,**/public/config/runtime-config.js

# ============ CONFIGURACIÓN DE COBERTURA ============
# Ruta al archivo de cobertura Python (Backend)
# SonarQube necesita la ruta relativa desde el directorio del proyecto
sonar.python.coverage.reportPaths=backend/coverage.xml

# Mapeo de rutas para que SonarQube encuentre correctamente los archivos
# Asegurar que las rutas en coverage.xml coincidan con las rutas de sonar.sources

# Ruta al archivo de cobertura JavaScript/Vue (Frontend)
# SonarQube usa esta propiedad para leer reportes LCOV de JavaScript/TypeScript/Vue
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# ============ CONFIGURACIÓN DE TESTS ============
# Directorio de tests (opcional, para reportes de tests)
sonar.tests=backend/tests,frontend/tests

# Reportes de ejecución de tests
# Comentado: SonarQube no soporta el formato JUnit de Vitest para Generic Test Executions
# La cobertura del frontend se envía correctamente a través de lcov.info
# sonar.testExecutionReportPaths=frontend/coverage/test-results.xml

# ============ CONFIGURACIÓN ADICIONAL ============
# Idioma principal del código
sonar.language=py,js

# Directorio base del proyecto (opcional)
# sonar.projectBaseDir=.

sonar.host.url=http://sonarqube.dataguaviare.com.co