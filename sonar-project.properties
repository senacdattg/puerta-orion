# ==================================================
# CONFIGURACIÓN SONARSCANNER - PUERTA DE ORION
# ==================================================

# Identificador único del proyecto en SonarQube
sonar.projectKey=puerta-orion

# Nombre del proyecto
sonar.projectName=puerta-orion

# Versión del proyecto
sonar.projectVersion=1.0

# Directorios fuente (relativos a este archivo)
sonar.sources=backend/src,frontend/src

# Codificación de los archivos fuente
sonar.sourceEncoding=UTF-8

# ============ CONFIGURACIÓN PYTHON ============
# Versión de Python
sonar.python.version=3.13

# Directorios de código Python
sonar.python.sources=backend/src

# Exclusiones para Python
sonar.exclusions=**/__pycache__/**,**/venv/**,**/env/**,**/migrations/**,**/tests/**,**/test_*.py,**/conftest.py,**/htmlcov/**,**/instance/**,**/logs/**,**/static/uploads/**

# Inclusiones para Python
sonar.inclusions=**/*.py

# ============ CONFIGURACIÓN JAVASCRIPT/VUE ============
# Directorios de código JavaScript/Vue
sonar.javascript.sources=frontend/src

# Exclusiones para JavaScript/Vue
sonar.javascript.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.min.js,**/*.min.css

# Inclusiones para JavaScript/Vue
sonar.javascript.inclusions=**/*.js,**/*.vue

# ============ EXCLUSIONES GLOBALES ============
# Archivos y directorios a excluir del análisis
sonar.exclusions=**/__pycache__/**,**/venv/**,**/env/**,**/node_modules/**,**/dist/**,**/build/**,**/migrations/**,**/tests/**,**/test_*.py,**/conftest.py,**/htmlcov/**,**/instance/**,**/logs/**,**/static/uploads/**,**/*.min.js,**/*.min.css,**/.git/**,**/.vscode/**,**/.idea/**,**/tmp/**

# ============ CONFIGURACIÓN DE COBERTURA ============
# Ruta al archivo de cobertura Python (Backend)
sonar.python.coverage.reportPaths=backend/coverage.xml

# ============ CONFIGURACIÓN DE TESTS ============
# Directorio de tests (opcional, para reportes de tests)
sonar.tests=backend/tests

# ============ CONFIGURACIÓN ADICIONAL ============
# Idioma principal del código
sonar.language=py,js

# Directorio base del proyecto (opcional)
# sonar.projectBaseDir=.

sonar.host.url=http://sonarqube.dataguaviare.com.co