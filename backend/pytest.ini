[pytest]
# Configuración de pytest para el proyecto Puerta Orion

# Directorio donde buscar tests
testpaths = tests

# Patrones de archivos de test
python_files = test_*.py *_test.py

# Patrones de clases de test
python_classes = Test*

# Patrones de funciones de test
python_functions = test_*

# Opciones de salida
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml:coverage.xml
    --junit-xml=junit.xml
    --cov-fail-under=20



