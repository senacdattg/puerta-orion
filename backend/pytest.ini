[pytest]
# Configuración de pytest para el proyecto Puerta Orion

# Directorio donde buscar tests
testpaths = tests

# Patrones de archivos de test
python_files = test_*.py *_test.py

# Patrones de clases de test
python_classes = Test*

# Patrones de funciones de test
python_functions = test_*

# Opciones de salida
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=20
    --log-cli-level=WARNING

# Marcadores personalizados
markers =
    unit: Tests unitarios que no requieren base de datos
    integration: Tests de integración que requieren base de datos
    slow: Tests que tardan más tiempo en ejecutarse
    auth: Tests relacionados con autenticación
    routes: Tests de rutas/endpoints

# Configuración de logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

